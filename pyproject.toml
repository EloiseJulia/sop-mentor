[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sop-mentor"
version = "0.1.0"
description = "Local-first pipeline for analyzing graduate essay writing patterns"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    # Document parsing
    "docling>=2.0.0",
    # Structured LLM extraction
    "instructor>=1.3.0",
    "openai>=1.30.0",
    # Schemas
    "pydantic>=2.6.0",
    # Config
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    # Similarity (optional at runtime but always installed)
    "rapidfuzz>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

[tool.hatch.build.targets.wheel]
packages = ["schemas"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
